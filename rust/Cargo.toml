[package]
name = "memt-sender"
version = "0.1.0"
edition = "2021"
description = "Hot-path transaction sender: signs a partially-built Jupiter swap tx and races it to Jito + multiple RPCs in parallel."

[[bin]]
name = "memt-sender"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1"
solana-sdk = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
